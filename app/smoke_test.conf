# M0 の確認用: プラグインを読み込めて、プロセスを HTTP から呼べることを確かめる (scripts/smoke_test.py が使う)
"name": "localization_amcl_smoke"
"option":
  "http_broker":
    "start": true
    "port": 8002
"plugins":
  "components":
    "localization_amcl":
      "language": "c++"
      "path": "plugins/{target}"
"processes":
  - "type_name": "localization_amcl_version"
    "name": "version0"
