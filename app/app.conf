# localization_amcl の起動設定
#   先に mobile_sim を IPC 名 mobile_sim で動かしておく(juiz run mobile_sim、または juiz -f app.conf -d --ipc mobile_sim)
#   開発中: scripts/dev_plugin.sh でプラグインを app/plugins/<target>/ に置いてから
#           cd app && juiz -f app.conf -d
#   mobile_sim のトピック odom(Pose2DStamped)・scan(LaserScan)・lidar_mount(PoseStamped)を受けて、
#   地図の上での自己位置を推定し、トピック amcl_pose(Pose2DStamped)に出す
"name": "localization_amcl"
"option":
  "http_broker":
    "start": true
    "port": 8002
    # ブラウザ画面(conf のディレクトリからの相対)
    "static_filepaths":
      "/": "web"
# mobile_sim からトピックを受けるため、こちらも IPC ブローカーを持つ
"brokers":
  - "type_name": "ipc"
    "name": "localization_amcl"
# mobile_sim につなぐ。package を書くと、juiz run は juizapp.yaml の depends の mobile_sim としてこれを使い、版を確かめる
# (別の機械の mobile_sim を使うときは juiz run --depend mobile_sim=http://<host>:8000)
"subsystems":
  - "package": "mobile_sim"
    "type_name": "ipc"
    "name": "mobile_sim"
"plugins":
  "components":
    "localization_amcl":
      "language": "c++"
      "path": "plugins/{target}"
"containers":
  # Transformations の Anchor。地図の座標系
  - { "type_name": "static_anchor", "name": "map" }
  # AMCL が推定したオドメトリの原点(map から見た odom0、ROS の map -> odom)。map -> amcl_odom0 の値は amcl0 が書く
  - { "type_name": "static_anchor", "name": "amcl_odom0" }
  - "type_name": "amcl"
    "name": "amcl0"
    # 地図(ROS map_server の YAML)。相対パスは JUIZ_APP_DIR(juiz run の展開先)、無ければカレントディレクトリから。
    # 環境変数 AMCL_MAP があればそちらを使う。あとから amcl_load_map・amcl_set_map で差し替えられる
    "map": "assets/maps/default.yaml"
    # 推定した姿勢を、map から見た amcl0 の ContainerPose として書く(下の transforms の map -> amcl0)
    "map_frame": "map"
    # 推定した map -> odom を、スキャンのたびに Transform map -> amcl_odom0 の値として書く(下の transforms の writers)
    "odom_frame": "amcl_odom0"
    # mobile_sim のトピック lidar_mount で LiDAR の取付位置を受け取るまで、スキャンを使わない
    "wait_laser_pose": true
    # 初期姿勢(mobile_sim の既定の初期姿勢と同じ)と、そのまわりの広がり。画面のドラッグや initialpose トピックで与え直せる
    "initial_pose_x": -2.0
    "initial_pose_y": 0.0
    "initial_pose_a": 0.0
    "initial_cov_xx": 0.25
    "initial_cov_yy": 0.25
    "initial_cov_aa": 0.0685
    # 以下は ROS の amcl と同じ名前・既定値。書かなければ既定値
    "min_particles": 100
    # ROS の既定は 5000。既定の地図は左の部屋が上下対称に近く、大域的な推定で 5000 個だと向きを取り違えることがあるので増やした。
    # 位置が決まっている間は KLD で数百個に減るので、普段の計算量はほとんど変わらない
    "max_particles": 20000
    "update_min_d": 0.2
    "update_min_a": 0.5236
    "resample_interval": 2
    "odom_model_type": "diff"
    "odom_alpha1": 0.2
    "odom_alpha2": 0.2
    "odom_alpha3": 0.2
    "odom_alpha4": 0.2
    "laser_model_type": "likelihood_field"
    "laser_max_beams": 60
    "laser_z_hit": 0.95
    "laser_z_rand": 0.05
    "laser_sigma_hit": 0.2
    "laser_likelihood_max_dist": 2.0
    # 大域的な推定のあとや見失ったときに、ランダムな粒子を足して立ち直る(0 で使わない)
    "recovery_alpha_slow": 0.001
    "recovery_alpha_fast": 0.1
    # ロボットの中心から見た LiDAR の位置。トピック lidar_mount が来ればそちらを使う
    "laser_pose": { "x": 0.0, "y": 0.0, "theta": 0.0 }
    "processes":
      - "type_name": "amcl_set_odometry"
        "name": "set_odometry0"
        "use_memo": false
        "subscribes":
          "odom": "odom"
      # スキャンのたびに推定した姿勢をトピック amcl_pose に出す
      - "type_name": "amcl_add_scan"
        "name": "add_scan0"
        "use_memo": false
        "subscribes":
          "scan": "scan"
        "publishes":
          - "amcl_pose"
      - "type_name": "amcl_set_laser_pose"
        "name": "set_laser_pose0"
        "use_memo": false
        "subscribes":
          "mount": "lidar_mount"
      # トピック initialpose(Pose2DStamped)で初期姿勢を与え直す(ROS の RViz の 2D Pose Estimate と同じ)
      - "type_name": "amcl_set_initial_pose"
        "name": "set_initial_pose0"
        "use_memo": false
        "subscribes":
          "pose": "initialpose"
      - "type_name": "amcl_global_localization"
        "name": "global_localization0"
        "use_memo": false
      - "type_name": "amcl_set_map"
        "name": "set_map0"
        "use_memo": false
      - "type_name": "amcl_load_map"
        "name": "load_map0"
        "use_memo": false
      - "type_name": "amcl_get_pose"
        "name": "get_pose0"
        "use_memo": false
      - "type_name": "amcl_get_map"
        "name": "get_map0"
        "use_memo": false
      - "type_name": "amcl_get_map_info"
        "name": "get_map_info0"
        "use_memo": false
      - "type_name": "amcl_get_state"
        "name": "get_state0"
        "use_memo": false
"processes":
  - "type_name": "localization_amcl_version"
    "name": "version0"
"transforms":
  # 値は amcl0 が推定した姿勢で書く
  - { "source": "map", "destination": "amcl0" }
  # 値は amcl0 が set_transform で書く(amcl_odom0 は Anchor なので自分では書けない。juiz 0.2.4、#410)
  - { "source": "map", "destination": "amcl_odom0", "writers": ["amcl0"] }
  # System をまたぐ Transform(juiz 0.2.1)。終点は mobile_sim の odom0 なので mobile_sim に作られ、mobile_sim が
  # amcl_odom0 の位置を rate [Hz] で取りに来る。mobile_sim の中で map -> amcl_odom0 -> odom0 -> robot0 -> lidar0 がつながる
  # (mapper_gmapping も odom0 に Transform を張るので、同時に動かすときはどちらかのこの行を消す)
  - { "source": "amcl_odom0", "destination": "ipc://mobile_sim/container/odom0::static_anchor", "rate": 20.0 }
