# mobile_sim と localization_amcl を一緒に動かす
#   docker compose -f docker/compose.yml up
# ブラウザで http://localhost:8002/ (自己位置推定) と http://localhost:8000/ (シミュレータ) を開く
services:
  mobile_sim:
    # localization_amcl は mobile_sim 0.3.1 以降で動く(System をまたぐ Transform)。別のイメージは MOBILE_SIM_IMAGE で渡す
    image: ${MOBILE_SIM_IMAGE:-ghcr.io/openjuiz/mobile_sim:0.3.2}
    ports:
      - "8000:8000"
    restart: unless-stopped
  localization_amcl:
    image: ghcr.io/openjuiz/localization_amcl:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - mobile_sim
    environment:
      MOBILE_SIM_URL: http://mobile_sim:8000
      # 既定の地図の代わりに使う地図 (例: mapper_gmapping で保存した /maps/map.yaml)
      # AMCL_MAP: /maps/map.yaml
    ports:
      - "8002:8002"
    volumes:
      - ./maps:/maps
    restart: unless-stopped
